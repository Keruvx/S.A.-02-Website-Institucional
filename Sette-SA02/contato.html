<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sette Studios - Contato</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header id="topo">
      <h1>Contato</h1>
      <p>Mande sua mensagem para a equipe</p>
    </header>

    <nav id="menu">
      <ul>
        <li><a href="index.html"><i class="fa-solid fa-house"></i> Início</a></li>
        <li><a href="pagina2.html"><i class="fa-solid fa-gamepad"></i> Projetos</a></li>
        <li><a href="pagina3.html"><i class="fa-solid fa-list-check"></i> Serviços</a></li>
        <li><a href="contato.html"><i class="fa-solid fa-envelope"></i> Contato</a></li>
      </ul>
    </nav>

    <main class="contatos">
      <section class="secao linha">
        <div class="caixa">
          <p><i class="fa-solid fa-envelope"></i> SetteSt@gmail.com</p>
        </div>
        <div class="caixa">
          <p><i class="fa-solid fa-phone"></i> 4002-8922</p>
        </div>
        <div class="caixa">
          <p><i class="fa-solid fa-location-dot"></i> Vitória - ES</p>
        </div>
      </section>

      <section class="secao">
        <h2>Formulário</h2>
        <form class="formulario" action="#" method="post">
          <div>
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Seu nome" required />
          </div>

          <div>
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="voce@email.com" required />
          </div>

          <div>
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(27) 99999-9999" />
          </div>

          <div>
            <label for="assunto">Assunto</label>
            <input type="text" id="assunto" name="assunto" placeholder="Sobre o que quer falar" />
          </div>

          <div>
            <label for="mensagem">Mensagem</label>
            <textarea id="mensagem" name="mensagem" placeholder="Escreva sua mensagem"></textarea>
          </div>

          <button type="submit" class="botao">
            <i class="fa-solid fa-paper-plane"></i> Enviar
          </button>
        </form>
      </section>


    </main>

    <footer id="rodape">
      <p>Jhonys Faustino Coser - 2026</p>
    </footer>
  </body>
</html>
